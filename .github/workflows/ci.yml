name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # O mínimo declarado em package.json (engines) e a versão 22 mais nova.
        node-version: ["22.13.0", "22.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      # Typecheck e testes offline: SDK falso, sem rede, sem conta Cursor e sem segredos.
      - run: npm run check

  # Renderiza todo bloco Mermaid do repositório e falha em erro de sintaxe. Só aqui: o mermaid-cli usa um Chromium
  # headless, que trava na máquina do mantenedor (docs/contributing/03-diagramas.md).
  #
  # O renderizador e o puppeteer ficam fixados e instalados num diretório próprio, e o Chromium é baixado num passo
  # explícito. Com `npx`, o cache do npm restaurado pelo setup-node trazia o pacote já instalado, o postinstall do
  # puppeteer não rodava e o navegador nunca chegava a ~/.cache/puppeteer: todo bloco falhava com
  # "Could not find chrome-headless-shell". Falha no download do navegador reprova o job; não há pulo.
  mermaid:
    runs-on: ubuntu-latest
    env:
      MERMAID_CLI_VERSION: 11.17.0
      # Peer dependency do mermaid-cli (^23 || ^24 || ^25); fixar define a versão do chrome-headless-shell.
      PUPPETEER_VERSION: 25.17.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Install the Mermaid renderer and its browser
        run: |
          dir="$RUNNER_TEMP/mermaid"
          mkdir -p "$dir"
          npm install --no-save --no-package-lock --prefix "$dir" \
            "@mermaid-js/mermaid-cli@$MERMAID_CLI_VERSION" "puppeteer@$PUPPETEER_VERSION"
          cd "$dir" && ./node_modules/.bin/puppeteer browsers install chrome-headless-shell
      - run: npm run docs:mermaid
        env:
          MERMAID_CLI: ${{ runner.temp }}/mermaid/node_modules/.bin/mmdc

  # Scans the checked-out tree for secrets with gitleaks and .gitleaks.toml (the default rules plus the allowlisted test
  # fakes): the same `gitleaks dir .` a maintainer runs locally. It scans the tree, not the history: history from before
  # this guard may hold a secret that needs a rewrite, not a check that fails every run. What the tree scan misses, a
  # secret added in one commit of a PR and removed in a later one, the pre-commit hook (.githooks/pre-commit) stops on the
  # contributor's machine. The binary is downloaded at a pinned version and checked against its SHA-256 (no
  # third-party action: CI uses first-party actions only), and the checkout keeps no token in .git/config.
  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      - run: $RUNNER_TEMP/gitleaks dir . --redact --no-banner
